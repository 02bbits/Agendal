# ~/.cloudflared/config.yml for the non-root cloudflared on the host (IM-65).
# Only the app's hostname goes to the web container; anything else gets 404.
tunnel: <tunnel id>
credentials-file: /home/<user>/.cloudflared/<tunnel id>.json

ingress:
  - hostname: <domain>
    service: http://localhost:3000 # or WEB_PORT from the root .env
  - service: http_status:404
