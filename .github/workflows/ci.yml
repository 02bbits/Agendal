# IM-04: CI gates 1, 2 and 6 from docs/06-testing/test-strategy.md.
# Every job must pass before a pull request can merge into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: agendal_test
          POSTGRES_USER: agendal
          POSTGRES_PASSWORD: agendal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agendal -d agendal_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, mbstring, zip, gd, exif
          coverage: pcov
      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Format (Pint)
        run: vendor/bin/pint --test
      - name: Type check (Larastan)
        run: composer analyse
      - name: Install document extraction tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Tests & coverage (Pest, Postgres)
        run: php -d pcov.enabled=1 -d pcov.directory=app vendor/bin/pest --coverage --min=70 --coverage-clover=coverage.xml
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            php -r '
              $xml = simplexml_load_file("coverage.xml");
              $m = $xml->project->metrics;
              $total = (int) $m["statements"];
              $covered = (int) $m["coveredstatements"];
              $pct = $total > 0 ? round($covered * 100 / $total, 2) : 0;
              file_put_contents(getenv("GITHUB_STEP_SUMMARY"), "### Backend Coverage\n- Lines: **{$pct}%** ({$covered}/{$total})\n", FILE_APPEND);
            '
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
      # IM-08: the docs generate from the code; Scramble reads column types, so the tables must exist
      - name: API docs (Scramble)
        env:
          DB_DATABASE: agendal_test
        run: php artisan migrate --force && php artisan scramble:analyze && php artisan scramble:export
      - uses: actions/upload-artifact@v4
        with:
          name: api.json
          path: backend/api.json
      - name: Dependency audit
        run: composer audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Tests & coverage (Vitest)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const fs = require("node:fs");
              const s = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Frontend Coverage\n- Lines: **${s.lines.pct}%** (${s.lines.covered}/${s.lines.total})\n- Branches: ${s.branches.pct}%\n- Functions: ${s.functions.pct}%\n`);
            '
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
