# IM-63: Nightly performance verification (NF-4, NF-5, Scalability).
# Runs k6 load tests (note processing budget + API SLOs + 5,000-task PERF-05),
# checks Laravel slow-query logs, runs Lighthouse CI (first load <= 3s),
# and verifies repeat load from Service Worker cache (<= 1s).
name: Nightly Performance

on:
  schedule:
    # 02:00 UTC daily (09:00 Asia/Ho_Chi_Minh)
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "perf/**"
      - "lighthouserc.json"
      - ".github/workflows/nightly-perf.yml"
      - "backend/database/seeders/PerfSeeder.php"

permissions:
  contents: read
  issues: write

jobs:
  perf:
    name: k6 & Lighthouse
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: agendal_perf
          POSTGRES_USER: agendal
          POSTGRES_PASSWORD: agendal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agendal -d agendal_perf"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install backend & seed perf data (incl. 5,000-task PERF-05 user)
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          cat >> .env << 'EOF'
          APP_ENV=local
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8000
          FRONTEND_URL=http://127.0.0.1:3000
          SANCTUM_STATEFUL_DOMAINS=127.0.0.1:8000,127.0.0.1:3000,localhost:3000
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=agendal_perf
          DB_USERNAME=agendal
          DB_PASSWORD=agendal
          NOTE_LLM_ENABLED=false
          DB_SLOW_QUERY_MS=500
          DB_SLOW_REQUEST_MS=2000
          EOF
          php artisan migrate --force
          php artisan db:seed --force
          php artisan db:seed --class=PerfSeeder --force

      - name: Start Laravel server
        working-directory: backend
        run: |
          nohup env PHP_CLI_SERVER_WORKERS=8 php -d opcache.enable=1 -d opcache.enable_cli=1 artisan serve --host=127.0.0.1 --port=8000 > /tmp/laravel.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "Backend is ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 note processing budget (NF-5 / PERF-02 / 30-item max)
        run: |
          BASE_URL=http://127.0.0.1:8000 \
          PERF_USER_COUNT=10 \
          NOTE_RATE=2 \
          NOTE_DURATION=30s \
          k6 run --summary-export=/tmp/k6-note-budget.json perf/k6/note-budget.js

      - name: Clear rate-limit cache before scalability suite
        working-directory: backend
        run: php artisan cache:clear

      - name: Run k6 scalability, reconnect & 5k-task user (PERF-01, PERF-04, PERF-05)
        run: |
          BASE_URL=http://127.0.0.1:8000 \
          PERF_USER_COUNT=10 \
          MIXED_RATE=10 \
          MIXED_DURATION=20s \
          k6 run --summary-export=/tmp/k6-scalability.json perf/k6/scalability.js

      - name: Verify no slow-query errors in Laravel logs
        working-directory: backend
        run: |
          if ls storage/logs/laravel*.log 1> /dev/null 2>&1; then
            if grep -iE "slow query|slow_request|exceeded" storage/logs/laravel*.log; then
              echo "::error::Slow query alerts triggered during performance run!"
              exit 1
            fi
          fi
          echo "No slow-query errors recorded."

      - name: Build & start Next.js production server
        working-directory: frontend
        run: |
          npm ci
          API_URL=http://127.0.0.1:8000 npm run build
          nohup env API_URL=http://127.0.0.1:8000 npm run start -- -H 127.0.0.1 -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/sign-in > /dev/null; then
              echo "Frontend is ready"
              break
            fi
            sleep 1
          done

      - name: Run Lighthouse CI — First load <= 3 s (NF-4)
        run: |
          npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.json

      - name: Verify Repeat load <= 1 s via Service Worker cache (NF-4)
        run: |
          npm --prefix /tmp/pw install --no-save playwright
          /tmp/pw/node_modules/.bin/playwright install chromium
          BASE_URL=http://127.0.0.1:3000 \
          PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.mjs \
          node perf/repeat-load.mjs

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: |
            /tmp/k6-note-budget.json
            /tmp/k6-scalability.json
            /tmp/laravel.log
            /tmp/next.log
            .lighthouseci/

      - name: Open issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Nightly performance budget failed ($(date -u +%Y-%m-%d))" \
            --body "Nightly k6 / Lighthouse run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "phase 6,testing"
